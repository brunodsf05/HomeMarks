<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <script>
      // This block of code is executed before the first render of the page.

      // Avoid FOUC. (https://en.wikipedia.org/wiki/Flash_of_unstyled_content)
      try {
        const bg = localStorage.getItem("CacheStyleBackground");
        if (bg) {
          document.documentElement.style.background = bg;
        }
      } catch {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HomeMarks</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
